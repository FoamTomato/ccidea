name: Release

# Trigger by pushing a tag like `v0.3.0`. The version in build.gradle.kts must match
# the tag (without the leading "v"). The workflow signs the plugin and publishes it
# to JetBrains Marketplace, then attaches the signed zip to a GitHub release.
#
# Required repository secrets:
#   CERTIFICATE_CHAIN          PEM-encoded certificate chain (the same value the
#                              Gradle plugin reads from this env var).
#   PRIVATE_KEY                Encrypted PEM private key.
#   PRIVATE_KEY_PASSWORD       Passphrase for PRIVATE_KEY.
#   JETBRAINS_MARKETPLACE_TOKEN  Marketplace upload token (per-account, not per-plugin).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew --no-configuration-cache test

      - name: Build plugin
        run: ./gradlew --no-configuration-cache buildPlugin

      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache signPlugin

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache publishPlugin

      - name: Attach signed plugin to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
